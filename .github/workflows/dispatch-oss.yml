name: "Dispatch OSS"

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  push:
    # This dispatch is an upstream NocoDB integration hook. Fork pushes must not allocate a runner
    # or attempt to dispatch into nocodb/nocohub with a fork-owned or missing secret.
    if: ${{ github.repository == 'nocodb/nocodb' }}
    runs-on: ubicloud-standard-2
    steps:
    - uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.OSS_DISPATCH }}
        script: |
          const result = await github.rest.repos.createDispatchEvent({
            owner: 'nocodb',
            repo: 'nocohub',
            event_type: 'OSS',
            client_payload: {
              push: ${{ toJSON(github.event) }}
            }
          })
